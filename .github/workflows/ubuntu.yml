name: ubuntu-build

on: 
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        kind: [static, shared]
        arch: [aarch64, x86_64]
    
    steps:
    - uses: actions/checkout@v4

    - name: Cache packages
      id: cache-xmake-ubuntu
      uses: actions/cache@v4
      env:
        cache-name: cache-node-modules
      with:
        path: ~/.xmake
        key: ${{ runner.os }}-${{ runner.arch }}-build-${{ env.cache-name }}-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-build-${{ env.cache-name }}-
          ${{ runner.os }}-${{ runner.arch }}-build-
          ${{ runner.os }}-${{ runner.arch }}-

    - uses: xmake-io/github-action-setup-xmake@v1
      with:
        xmake-version: 3.0.8
        actions-cache-folder: '.xmake-cache'
        actions-cache-key: 'ubuntu'

    - name: config
      run: |
        xmake f -c -k ${{ matrix.kind }} -y -vD --mysql=y --http_client_zip=y --http_client_ssl=y

    - name: build
      run: |
        xmake -bvD unit-test
  
    - name: test
      run: |
        xmake r unit-test
  